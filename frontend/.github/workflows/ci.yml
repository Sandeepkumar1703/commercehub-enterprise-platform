name: Vynk Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint, Unit & Integration Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Type Check & ESLint
        run: npm run lint

      - name: Run Vitest Unit & Integration Suites
        run: npm test

      - name: Build Standalone Production Bundle
        run: npm run build

  e2e-testing:
    name: Playwright End-To-End Browser Testing
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        run: npx playwright test

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker-build:
    name: Containerize & Push Artifact
    runs-on: ubuntu-latest
    needs: e2e-testing
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: commercehub-enterprise:latest
