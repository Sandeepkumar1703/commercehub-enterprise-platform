version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_API_URL=/api
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: commercehub_db
    environment:
      POSTGRES_DB: commercehub
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: enterprise_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
